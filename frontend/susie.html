<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SÜSIE — Prüfakte</title>
  <link rel="stylesheet" href="susie.css" />
</head>
<body data-theme="auto">

  <!-- Faded geometric background: two authored waves + one orbit ring, crimson-tinted -->
  <svg class="backdrop" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="wave-a" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#c8133f" stop-opacity="0"/>
        <stop offset=".55" stop-color="#c8133f" stop-opacity=".07"/>
        <stop offset="1" stop-color="#c8133f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="wave-b" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1d4e89" stop-opacity="0"/>
        <stop offset=".5" stop-color="#1d4e89" stop-opacity=".05"/>
        <stop offset="1" stop-color="#1d4e89" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M-80 700 C 260 560, 520 820, 860 690 S 1380 540, 1560 640 L 1560 980 L -80 980 Z" fill="url(#wave-a)"/>
    <path d="M-80 780 C 300 660, 620 880, 980 760 S 1420 660, 1560 740 L 1560 980 L -80 980 Z" fill="url(#wave-b)"/>
    <circle cx="120" cy="120" r="230" fill="none" stroke="#c8133f" stroke-opacity=".06" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="160" fill="none" stroke="#c8133f" stroke-opacity=".04" stroke-width="1"/>
  </svg>

  <div class="app" id="app">

    <aside class="sidebar">
      <button id="susie-entry" class="susie-entry" title="SÜSIE öffnen (Vollbild)" aria-pressed="false">
        <span class="susie-glow" aria-hidden="true"></span>
        <img src="assets/susie-logo.png" alt="SÜSIE" class="susie-logo-img" />
      </button>

      <nav class="side-nav" aria-label="Hauptnavigation">
        <button class="side-link active" data-view="cases">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9h6M7 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Fälle</span>
        </button>
        <button class="side-link" data-view="report">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10v14H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 7h4M8 10h4M8 13h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Protokoll</span>
        </button>
        <button class="side-link" data-view="sources">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Quellen</span>
        </button>
        <a class="side-ext" href="pruefakte.html" title="Prüfakte — erweiterter Modus">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="7.5" cy="6" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="12.5" cy="10" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="14" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Erweiterter Modus</span>
        </a>
      </nav>

      <div class="side-foot">
        <button id="lang-toggle" class="ghost-lang" title="Sprache / Language">DE</button>
        <button id="theme-toggle" class="ghost-icon" title="Hell / Dunkel umschalten" aria-label="Darstellung umschalten">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v2M10 14.5v2M3.5 10h2M14.5 10h2M5.3 5.3l1.4 1.4M13.3 13.3l1.4 1.4M14.7 5.3l-1.4 1.4M6.7 13.3l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </aside>

    <main class="main" id="main">

      <!-- ============ App views (overlay mode shows these behind the chat) ============ -->
      <div id="app-views">

        <header class="topbar">
          <div>
            <h1 id="topbar-title">Fälle</h1>
            <p class="topbar-sub" id="topbar-sub">Systemüberprüfung sozialversicherungsrechtlicher IT-Ergebnisse</p>
          </div>
          <div id="case-summary" class="summary-chips" aria-live="polite"></div>
        </header>

        <!-- Cases view -->
        <section id="view-cases" class="view">
          <div id="case-list" class="case-list"></div>
        </section>

        <!-- Report view -->
        <section id="view-report" class="view" hidden>
          <div id="report-body"></div>
        </section>

        <!-- Sources view -->
        <section id="view-sources" class="view" hidden>
          <div id="sources-body"></div>
        </section>
      </div>

      <!-- ============ Fullscreen SÜSIE mode ============ -->
      <section id="susie-full" class="susie-full" hidden>
        <header class="susie-full-head">
          <img src="assets/susie-logo.png" alt="" class="susie-logo-img" />
          <span class="susie-mode-tag" id="susie-mode-tag">Vollbild-Modus</span>
          <button id="to-overlay" class="ghost-btn">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h12v-4M12 4h4v4M16 4l-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Overlay-Modus</span>
          </button>
        </header>
        <div id="chat-full" class="chat chat-full"></div>
      </section>
    </main>

    <!-- ============ Floating overlay wizard ============ -->
    <aside id="susie-overlay" class="susie-overlay" role="complementary" aria-label="SÜSIE Assistentin" hidden>
      <header class="overlay-head">
        <img src="assets/susie-logo.png" alt="SÜSIE" class="susie-logo-img small" />
        <button id="to-fullscreen" class="ghost-icon" title="Vollbild-Modus" aria-label="Vollbild-Modus">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8V4h4M16 12v4h-4M4 4l5 5M16 16l-5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="overlay-close" class="ghost-icon" title="SÜSIE schließen" aria-label="Schließen">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="chat-overlay" class="chat chat-panel"></div>
    </aside>
  </div>

  <!-- ============ Chat agent FAB (bottom-right flyover) ============ -->
  <button id="susie-fab" class="susie-fab" hidden aria-label="SÜSIE Assistentin öffnen" title="SÜSIE Assistentin öffnen">
    <span class="fab-glow" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 3.5V17H6.5A2.5 2.5 0 0 1 4 14.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/><circle cx="12" cy="10.5" r="1" fill="currentColor"/><circle cx="15" cy="10.5" r="1" fill="currentColor"/></svg>
  </button>

  <!-- ============ Bottom bar matching the logo ============ -->
  <footer class="bottom-bar">
    <span class="mark" aria-hidden="true"></span>
    <span class="bottom-brand">SÜSIE</span>
    <span class="bottom-sep" aria-hidden="true"></span>
    <span id="bottom-note" class="bottom-note">Synthetische Daten · keine Konformitäts- oder Rechtsauffassung</span>
    <span class="bottom-spacer"></span>
    <span id="bridge-dot" class="bridge-dot" title="Bridge-Verbindung"></span>
    <span id="bridge-label" class="bridge-label">Verbinde …</span>
  </footer>

  <script src="susie.js"></script>
</body>
</html>
